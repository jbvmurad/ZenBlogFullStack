<div class="admin-shell">
  <aside class="admin-sidebar">
    <div>
      <a routerLink="/" class="admin-brand text-decoration-none">
        <span class="admin-brand-mark">Z</span>
        <div>
          <strong>ZenBlog</strong>
          <small>Admin dashboard</small>
        </div>
      </a>

      <div class="admin-user-card">
        <ng-container *ngIf="userImage; else adminInitials">
          <img [src]="userImage" [alt]="getUserName()" class="admin-user-avatar">
        </ng-container>
        <ng-template #adminInitials>
          <div class="admin-user-avatar admin-user-fallback">{{ initials }}</div>
        </ng-template>

        <div>
          <h6>{{ getUserName() }}</h6>
          <p>{{ dashboardRoleTitle }}</p>
        </div>
      </div>

      <nav class="admin-nav">
        <a routerLink="/admin/category" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-list"></i><span>Categories</span></a>
        <a routerLink="/admin/blog" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-image"></i><span>Blogs</span></a>
        <a routerLink="/admin/comment" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-comment"></i><span>Comments</span></a>
        <a routerLink="/admin/contactinfo" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-phone"></i><span>Contact info</span></a>
        <a routerLink="/admin/message" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-envelope"></i><span>Messages</span></a>
        <a routerLink="/admin/social" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-linkedin"></i><span>Social networks</span></a>
        <a routerLink="/admin/users" routerLinkActive="active" class="admin-nav-link"><i class="fa fa-users"></i><span>Users & Roles</span></a>
      </nav>
    </div>

    <div class="admin-sidebar-footer">
      <a routerLink="/profile" class="btn btn-outline-light rounded-pill w-100 mb-2">Profile</a>
      <a routerLink="/settings" class="btn btn-light rounded-pill w-100 mb-2">Settings</a>
      <button class="btn btn-danger rounded-pill w-100" (click)="logout()">Logout</button>
    </div>
  </aside>

  <section class="admin-content">
    <div class="admin-content-inner">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
