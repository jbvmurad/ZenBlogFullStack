<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <h3 class="mb-0">Comments</h3>
      <div class="text-muted small">Moderate user comments</div>
    </div>
  </div>

  <div class="card admin-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
  <thead>


    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Email</th>
      <th>Comment</th>
      <th>Date</th>
      <th>Blog</th>
      <th>Options</th>
    </tr>
  </thead>
<tbody>
  <tr *ngFor="let item of comments; let i = index;">
    <th>{{i+1}}</th>
    <td>{{item.firstName}} {{item.lastName}}</td>
    <td>{{item.email}}</td>
    <td>{{item.body}}</td>
    <td>{{item.createdAt | date:'medium'}}</td>
    <td>{{item.blog?.title || item.blogId}}</td>
    <td>
      <button class="btn btn-outline-danger" (click)="delete(item.id)"> <i class="fa fa-trash"></i>  </button>

    </td>
  </tr>
</tbody>
      </table>
    </div>
  </div>

</div>
