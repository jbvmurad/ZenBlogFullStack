<div class="admin-page">
  <div class="admin-page-header">
    <div>
      <h3 class="mb-0">Categories</h3>
      <div class="text-muted small">Manage your blog categories</div>
    </div>
    <div class="admin-header-actions">
      <div class="admin-search-shell">
        <i class="fa fa-search admin-search-icon"></i>
        <input
          type="text"
          class="form-control admin-search-input"
          [(ngModel)]="searchTerm"
          placeholder="Search category..."
          aria-label="Search categories"
        />
        <button
          class="admin-search-clear"
          [class.is-visible]="!!searchTerm"
          type="button"
          (click)="searchTerm=''"
          [disabled]="!searchTerm"
          aria-label="Clear category search"
        >
          <i class="fa fa-times"></i>
        </button>
      </div>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
        <i class="fa fa-plus me-1"></i> New Category
      </button>
    </div>
  </div>

  <div class="card admin-card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
  <thead>


    <tr>
      <th>#</th>
      <th>Category Name</th>
      <th>Options</th>
    </tr>
  </thead>
<tbody>
  <tr *ngFor="let item of filteredCategories; let i = index;">
    <th>{{i+1}}</th>
    <td>{{item.categoryName}}</td>
    <td>
      <button class="btn btn-outline-danger" (click)="delete(item.id)"> <i class="fa fa-trash"></i>  </button>
      <button class="btn btn-outline-info ms-2" data-bs-toggle="modal" data-bs-target="#editModal" (click)="onSelected(item)" ><i class="fa fa-edit"></i>  </button>
    </td>
  </tr>
  <tr *ngIf="(filteredCategories?.length ?? 0) === 0">
    <td colspan="3" class="text-center text-muted py-4">No category found.</td>
  </tr>
</tbody>
      </table>
    </div>
  </div>



 </div>



<!-- Create Modal -->
<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="createModalLabel">Create New Category</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
 <form #createForm="ngForm" (ngSubmit)="createCategory(); createForm.resetForm()">
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" class="form-control" name="categoryName" [(ngModel)]="newCategory.categoryName" required="">
        <div *ngIf="errors.length > 0">
          <div *ngFor="let errorObj of errors">
            <div *ngFor="let entry of (errorObj | keyvalue)">
              <div *ngIf="entry.key==='CategoryName'">
              <span class="text-danger">{{entry.value}}</span>
            </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"> <i class="fa fa-times"></i> Close</button>
        <button type="submit" class="btn btn-primary"> <i class="fa fa-save"></i> Save changes</button>
      </div>
</form>
      </div>

    </div>

  </div>
</div>


<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="editModalLabel">Update Category</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
 <form #editForm="ngForm" (ngSubmit)="update()">
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" class="form-control" name="categoryName" [(ngModel)]="editCategory.categoryName" required="">
          <div *ngIf="errors.length > 0">
          <div *ngFor="let errorObj of errors">
            <div *ngFor="let entry of (errorObj | keyvalue)">
              <div *ngIf="entry.key==='CategoryName'">
              <span class="text-danger">{{entry.value}}</span>
            </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fa fa-times"></i>  Close</button>
        <button type="submit" class="btn btn-primary" [disabled]="editForm.invalid || !editForm.dirty"> <i class="fa fa-edit"></i> Update changes</button>
      </div>
</form>
      </div>

    </div>

  </div>
</div>
