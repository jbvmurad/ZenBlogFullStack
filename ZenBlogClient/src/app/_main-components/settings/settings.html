<section class="settings-page py-5">
  <div class="container">
    <div class="settings-shell">
      <div class="settings-sidebar-card">
        <div class="settings-avatar-wrap">
          <img *ngIf="previewUrl; else settingsInitials" [src]="previewUrl" alt="Profile image" class="settings-avatar">
          <ng-template #settingsInitials>
            <div class="settings-avatar settings-avatar-fallback">{{ initials }}</div>
          </ng-template>
        </div>
        <h4>{{ form.fullName || 'Your profile' }}</h4>
        <p>{{ form.email || 'Add your email' }}</p>

        <label class="btn btn-dark rounded-pill px-4 mt-2">
          <input type="file" accept="image/*" hidden (change)="onImageSelected($event)">
          Choose photo
        </label>
        <button *ngIf="selectedImage" type="button" class="btn btn-outline-secondary rounded-pill px-4 mt-2" (click)="clearSelectedImage()">Reset selection</button>
      </div>

      <div class="settings-form-card">
        <div class="settings-header">
          <div>
            <span class="eyebrow">Profile settings</span>
            <h2>Manage your account</h2>
            <p>Update your profile information and upload your own avatar.</p>
          </div>
        </div>

        <form (ngSubmit)="save()" #settingsForm="ngForm">
          <div class="row g-4">
            <div class="col-md-6">
              <label class="form-label">Full name</label>
              <input class="form-control form-control-lg rounded-4" name="fullName" [(ngModel)]="form.fullName" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input class="form-control form-control-lg rounded-4" name="email" [(ngModel)]="form.email" type="email" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone number</label>
              <input class="form-control form-control-lg rounded-4" name="phoneNumber" [(ngModel)]="form.phoneNumber">
            </div>
            <div class="col-md-6">
              <label class="form-label">New password</label>
              <input class="form-control form-control-lg rounded-4" name="password" [(ngModel)]="form.password" type="password" placeholder="Leave empty if backend allows it">
            </div>
          </div>

          <div class="settings-actions">
            <button type="submit" class="btn btn-dark rounded-pill px-4" [disabled]="saving">
              {{ saving ? 'Saving...' : 'Save changes' }}
            </button>
            <a routerLink="/profile" class="btn btn-outline-dark rounded-pill px-4">Cancel</a>
          </div>
        </form>

        <div class="danger-zone">
          <div>
            <h5>Delete account</h5>
            <p>This will permanently remove your account.</p>
          </div>
          <button type="button" class="btn btn-outline-danger rounded-pill px-4" [disabled]="deleting" (click)="deleteAccount()">
            {{ deleting ? 'Deleting...' : 'Delete account' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
