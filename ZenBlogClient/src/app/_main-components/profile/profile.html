<div class="container" style="max-width: 900px;">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h2 class="mb-1">Profile</h2>
      <p class="text-muted mb-0">Your account information.</p>
    </div>
    <a routerLink="/settings" class="btn btn-primary btn-sm">
      <i class="fa fa-cog me-1"></i> Settings
    </a>
  </div>

  <div *ngIf="loading" class="card p-4">
    <div class="d-flex align-items-center">
      <div class="spinner-border" role="status" aria-label="Loading"></div>
      <div class="ms-3">Loading profile…</div>
    </div>
  </div>

  <div *ngIf="!loading && error" class="alert alert-danger">
    {{ error }}
  </div>

  <div *ngIf="!loading && user" class="row g-3">
    <div class="col-12">
      <div class="card profile-card">
        <div class="card-body">
          <div class="d-flex align-items-center gap-3">
            <div class="avatar">
              <i class="fa fa-user"></i>
            </div>
            <div class="flex-grow-1">
              <h4 class="mb-0">{{ user.fullName || user.userName }}</h4>
              <div class="text-muted">{{ user.email }}</div>
            </div>
          </div>

          <hr class="my-4" />

          <div class="row">
            <div class="col-md-6 mb-3">
              <div class="text-muted small">Full Name</div>
              <div class="fw-semibold">{{ user.fullName || '-' }}</div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="text-muted small">Username</div>
              <div class="fw-semibold">{{ user.userName || '-' }}</div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="text-muted small">Email</div>
              <div class="fw-semibold">{{ user.email || '-' }}</div>
            </div>
            <div class="col-md-6 mb-3">
              <div class="text-muted small">Phone</div>
              <div class="fw-semibold">{{ user.phoneNumber || '-' }}</div>
            </div>
          </div>

          <div class="d-flex flex-wrap gap-2 mt-2">
            <a routerLink="/settings" class="btn btn-outline-primary">
              Edit profile
            </a>
            <a routerLink="/" class="btn btn-light">
              Back to Home
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
