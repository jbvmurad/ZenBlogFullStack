<section class="section auth-section">
  <div class="container" data-aos="fade-up" data-aos-delay="100">
    <div class="row justify-content-center">
      <div class="col-12 col-md-9 col-lg-6">
        <div class="card auth-card border-0 shadow-sm">
          <div class="card-body p-4 p-lg-5">
            <div class="text-center mb-4">
              <div class="auth-logo mb-3">
                <span class="badge auth-badge">ZenBlog</span>
              </div>
              <h1 class="h4 mb-1">Forgot password</h1>
              <p class="text-muted mb-0">Enter your email and we'll send you a reset link.</p>
            </div>

            <form #forgotForm="ngForm" (ngSubmit)="submit()">
              <div class="mb-4">
                <label class="form-label">Email</label>
                <input
                  type="email"
                  name="email"
                  class="form-control form-control-lg"
                  placeholder="you@example.com"
                  [(ngModel)]="email"
                />
              </div>

              <button class="btn btn-primary btn-lg w-100" type="submit" [disabled]="isSubmitting">
                Send reset link
              </button>

              <div class="auth-links d-flex justify-content-between mt-3">
                <a routerLink="/" class="small text-decoration-none">← Back to Home</a>
                <a (click)="goLogin()" class="small text-decoration-none" style="cursor:pointer;">Back to Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
